[project]
name = "anthropic-proxy"
version = "0.1.0"
description = "Proxy that translates between Anthropic API and LiteLLM"
readme = "README.md"
requires-python = ">=3.14,<3.15"
classifiers = [
    "Operating System :: POSIX :: Linux",
]
dependencies = [
    "fastapi[standard]>=0.141.1",
    "uvicorn>=0.53.0",
    "httpx>=0.28.1",
    "pydantic>=2.13.5",
    "litellm>=1.101.0",
    "python-dotenv>=1.2.3",
    "google-auth>=2.58.0",
    "google-cloud-aiplatform>=2.1.3",
    "typer>=0.21.1",
    "wcwidth>=0.3.0",
    "textual>=6.6.0",
]

[project.scripts]
claude-code-proxy = "claude_code_proxy.cli:app"

[dependency-groups]
dev = [
    "httpx2>=2.13.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "pyyaml>=6.0.3",
]


[tool.pytest.ini_options]
testpaths = ["test"]
pythonpath = ["src"]
addopts = "--strict-markers --strict-config --import-mode=importlib"
asyncio_mode = "auto"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/claude_code_proxy"]
