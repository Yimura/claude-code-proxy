services:
  proxy:
    build: .
    restart: unless-stopped
    env_file: .env
    ports:
      - "127.0.0.1:8082:8082"
    volumes:
      - ${OPENCODE_DATA_DIR:-~/.local/share/opencode}:/opencode-auth:ro
    configs:
      - source: model_mapping
        target: /claude-code-proxy/model_mapping.json
    environment:
      - OPENCODE_DATA_DIR=/opencode-auth

configs:
  model_mapping:
    file: ./model_mapping.json
